# 文件、編碼／行尾、SQL 與 workflow 檢查（Plan.md §6.3 1-8）
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # 檢查工具皆使用以 digest 固定的容器映像（Scorecard Pinned-Dependencies）
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown（markdownlint-cli2）
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: 編碼與行尾（editorconfig-checker）
        uses: docker://mstruebing/editorconfig-checker@sha256:2ba6232bfa0058f72f5f7d7816711590aa764afab1542af30b3ecb4553587918 # 4.0.2

      # 只檢查新的 migration／維運腳本；舊的 DbSql.sql 已過時，不納入
      - name: SQL（sqlfluff，T-SQL）
        if: hashFiles('db/**/*.sql', 'Website/Migrations/**/*.sql') != ''
        uses: docker://sqlfluff/sqlfluff@sha256:8003e7099a43661bb972bb29b6c66ef0954545586a047bd88cdbdfb6d758f144 # 4.3.0
        with:
          entrypoint: /bin/sh
          args: -c "sqlfluff lint --dialect tsql $(for d in db Website/Migrations; do [ -d $d ] && printf '%s ' $d; done)"

      - name: Workflow（actionlint）
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
