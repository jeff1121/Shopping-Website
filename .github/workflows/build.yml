# 建置與部署套件 SBOM（Plan.md §7.2、§7.3；供 §11.1 deploy.yml workflow_call 重用）
name: 建置

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: 發行套件 artifact 名稱。
        value: ${{ jobs.build.outputs.artifact-name }}

permissions: {}

concurrency:
  # workflow_call 由部署流程重用時避免互相取消；一般 CI 則取消同分支舊執行。
  group: ${{ github.event_name == 'workflow_call' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  build:
    name: 建置
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.workflow-output.outputs.artifact-name }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: 設定 NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: 還原 NuGet 套件
        shell: pwsh
        run: nuget restore Website.sln

      - name: 注入組件版本
        shell: pwsh
        run: |
          $assemblyInfo = Join-Path $env:GITHUB_WORKSPACE 'Website\Properties\AssemblyInfo.cs'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = "1.0.$env:GITHUB_RUN_NUMBER+$shortSha"
          $text = [IO.File]::ReadAllText($assemblyInfo, [Text.Encoding]::UTF8)
          if (-not $text.Contains('1.0.0-local')) {
            throw '找不到 AssemblyInformationalVersion 佔位字串 1.0.0-local。'
          }
          $text = $text.Replace('1.0.0-local', $version)
          $utf8Bom = New-Object Text.UTF8Encoding $true
          [IO.File]::WriteAllText($assemblyInfo, $text, $utf8Bom)

      - name: 建置並發行至資料夾
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          msbuild Website\Website.csproj `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:DeployDefaultTarget=WebPublish `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="$publishDir\" `
            /p:DeleteExistingFiles=true `
            /p:PublishProvider=FileSystem `
            /m `
            /nologo `
            /v:minimal

      - name: 清理發行內容並檢查必要檔案
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          $productsDir = Join-Path $publishDir 'img\products'
          if (Test-Path $productsDir) {
            Get-ChildItem -Path $productsDir -Directory | Remove-Item -Recurse -Force
          }

          $requiredFiles = @(
            'img\products\human.png',
            'bin\Website.dll',
            'Web.config',
            'index.aspx'
          )
          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path $publishDir $relativePath
            if (-not (Test-Path $fullPath -PathType Leaf)) {
              throw "發行結果缺少必要檔案：$relativePath"
            }
          }

          # 以 XML 檢查 compilation 元素（註解中的 debug 字樣不影響判斷）
          [xml]$webConfig = Get-Content (Join-Path $publishDir 'Web.config') -Raw
          $compilation = $webConfig.configuration.'system.web'.compilation
          if ($compilation -and $compilation.GetAttribute('debug') -eq 'true') {
            throw 'Release 發行結果的 Web.config 仍含 debug="true"。'
          }

      - name: 壓縮網站套件
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          $zipPath = Join-Path $env:RUNNER_TEMP 'site.zip'
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Push-Location $publishDir
          Compress-Archive -Path * -DestinationPath $zipPath -CompressionLevel Optimal
          Pop-Location

      - name: 保存網站套件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: ${{ runner.temp }}\site.zip
          retention-days: 30
          if-no-files-found: error

      - name: 輸出網站套件名稱
        id: workflow-output
        shell: pwsh
        run: '"artifact-name=site" >> $env:GITHUB_OUTPUT'

  package-sbom:
    name: 部署套件 SBOM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # 以下兩項僅供簽章步驟使用（PR 不簽章）
      id-token: write
      attestations: write
    steps:
      - name: 下載網站套件
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: artifact

      - name: 展開網站套件
        run: unzip -q artifact/site.zip -d package

      # Syft 會掃描部署根目錄、Web.config、bin/*.dll 與靜態資產；舊式 .NET DLL 的精確版本可能無法全數辨識，NuGet 風險仍以相依圖與原始碼 SBOM 補足。
      - name: 產生部署套件 SBOM（SPDX）
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: package
          format: spdx-json
          output-file: sbom-package.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 產生部署套件 SBOM（CycloneDX）
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: package
          format: cyclonedx-json
          output-file: sbom-package.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 漏洞比對（Grype，部署套件）
        id: grype-package
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom-package.spdx.json
          output-format: sarif
          output-file: grype-package.sarif
          severity-cutoff: high
          # 試運行期間只回報不阻擋；高風險新增套件另由 Dependency Review 把關。
          fail-build: false

      - name: 上傳比對結果至 Code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype-package.outputs.sarif }}
          category: grype-package

      - name: 簽章部署套件 SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: artifact/site.zip
          sbom-path: sbom-package.spdx.json

      - name: 產生建置來源證明
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifact/site.zip

      - name: 保存部署套件 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-package
          path: |
            sbom-package.spdx.json
            sbom-package.cdx.json
          retention-days: 90
          if-no-files-found: error
