# 相依套件自動更新（Plan.md §6.3 1-5）
version: 2
updates:
  - package-ecosystem: nuget
    directory: /Website
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    commit-message:
      prefix: '相依套件：'
    labels: [dependencies]
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    commit-message:
      prefix: '相依套件：'
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ['*']
